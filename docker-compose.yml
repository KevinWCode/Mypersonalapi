services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  collector:
    build: .
    env_file: .env
    command: ["python", "-m", "app.collect", "--loop"]
    volumes:
      - ./data:/data
    restart: unless-stopped
